<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devítka I — Nebeská rodina | Cello Cool Club</title>
<link rel="icon" href="../../assets/ccc-icon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --papir: #ecdfc0;
    --papir-tmavy: #ddcda8;
    --papir-svetly: #f4ecd8;
    --inkoust: #453626;
    --vinyl: #1c1815;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #10151f;
    min-height: 100vh;
    overflow: hidden;
    font-family: "EB Garamond", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
  }

  .zahlavi { text-align: center; color: rgba(236,224,196,.85); user-select: none; }
  h1 {
    font-weight: 500;
    font-size: clamp(20px, 3.2vh, 30px);
    letter-spacing: .24em;
    text-indent: .24em;
    font-variant: small-caps;
  }
  .podtitul {
    margin-top: .4vh;
    font-style: italic;
    font-size: clamp(12px, 1.9vh, 17px);
    color: rgba(236,224,196,.6);
  }
  .pocitadlo {
    margin-top: .6vh;
    font-size: clamp(12px, 1.7vh, 16px);
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(236,224,196,.5);
  }

  .police { display: grid; grid-template-columns: repeat(3, auto); gap: 2.6vh; }

  .pozice {
    position: relative;
    height: 24vh;
    aspect-ratio: 687 / 1024;
    border-radius: 5px;
    cursor: pointer;
    transition: transform .3s ease;
  }
  .pozice:hover { transform: translateY(-6px); }

  .pozice .vinylek {
    position: absolute;
    top: 50%; right: -9%;
    width: 78%;
    aspect-ratio: 1;
    transform: translateY(-50%);
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle,
        var(--vinyl) 0 1.6px,
        #262019 1.6px 2px,
        var(--vinyl) 2px 3.6px);
    box-shadow: 3px 0 12px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(236,224,196,.14);
    transition: right .4s ease;
    display: none;
  }
  .pozice.odemcena .vinylek { display: block; }
  .pozice.odemcena:hover .vinylek { right: -16%; }

  .obal {
    position: absolute;
    inset: 0;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 3px 9px rgba(0,0,0,.35);
    background-color: var(--papir-tmavy);
    background-position: center;
    background-size: cover;
  }
  .obal::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 7px;
    background: linear-gradient(to left, rgba(0,0,0,.28), transparent);
  }

  /* duch: další na řadě, prosvítá pod papírem */
  .pozice.duch .obal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(236,223,192,.82);
    backdrop-filter: blur(3px) grayscale(1);
  }

  /* zamčená: slepý obal */
  .pozice.zamcena .obal {
    background-image: none !important;
    background:
      radial-gradient(ellipse at 32% 12%, rgba(255,250,235,.5), transparent 60%),
      radial-gradient(ellipse at 82% 92%, rgba(120,95,55,.14), transparent 55%),
      var(--papir-tmavy);
  }
  .razba {
    position: absolute;
    left: 50%; top: 44%;
    width: 46%;
    aspect-ratio: 1;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    box-shadow:
      inset 1.5px 1.5px 3px rgba(120,95,55,.4),
      inset -1.5px -1.5px 3px rgba(255,250,235,.65),
      1px 1px 2px rgba(255,250,235,.5);
    display: none;
  }
  .razba::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 12%;
    aspect-ratio: 1;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    box-shadow:
      inset 1px 1px 2px rgba(120,95,55,.45),
      inset -1px -1px 2px rgba(255,250,235,.6);
  }
  .pozice.zamcena .razba, .pozice.duch .razba { display: block; }

  svg.ornament {
    position: absolute;
    left: 50%; bottom: 9%;
    transform: translateX(-50%);
    width: 55%;
    height: 12px;
    color: rgba(109,92,68,.5);
    display: none;
  }
  .pozice.zamcena svg.ornament, .pozice.duch svg.ornament { display: block; }

  @keyframes zatres {
    0%,100% { transform: translateY(-6px) rotate(0); }
    25% { transform: translateY(-6px) rotate(-1.2deg); }
    75% { transform: translateY(-6px) rotate(1.2deg); }
  }
  .pozice.trese { animation: zatres .35s ease; }

  .napoveda {
    min-height: 2.6vh;
    font-style: italic;
    font-size: clamp(12px, 1.8vh, 16px);
    color: rgba(236,224,196,.55);
    opacity: 0;
    transition: opacity .4s;
    user-select: none;
  }
  .napoveda.ukaz { opacity: 1; }
</style>
</head>
<body>

  <header class="zahlavi">
    <h1>Devítka I</h1>
    <div class="podtitul">Nebeská rodina · The Celestial Household</div>
    <div class="pocitadlo" id="pocitadlo">0 / 9</div>
  </header>

  <div class="police" id="police"></div>

  <div class="napoveda" id="napoveda">další deska se odemkne, až doposloucháš tu předchozí</div>

<script>
  // pořadí poslechu (odemykání)
  var PORADI = [
    '0004-mercury', '0008-venus', '0009-earth', '0003-mars',
    '0002-jupiter', '0006-saturn', '0007-uranus', '0005-neptune', '0016-sun'
  ];
  // rozložení na polici 3×3 (Slunce uprostřed)
  var POLICE = [
    '0004-mercury', '0008-venus', '0009-earth',
    '0003-mars',    '0016-sun',   '0002-jupiter',
    '0006-saturn',  '0007-uranus','0005-neptune'
  ];
  var NAZVY = {
    '0004-mercury': 'Mercury, the Hurried Messenger',
    '0008-venus':   'Venus, the Veiled Beauty',
    '0009-earth':   'Earth, the Noisy House',
    '0003-mars':    'Mars, the Old Soldier',
    '0016-sun':     'The Sun, the Lonely King',
    '0002-jupiter': 'Jupiter, the Stormy King',
    '0006-saturn':  'Saturn, the Sad Ballerina',
    '0007-uranus':  'Uranus, the Silent Rebel',
    '0005-neptune': 'Neptune, the Lighthouse Keeper'
  };

  var vse = new URLSearchParams(location.search).has('vse');
  var stav = {};
  try { stav = JSON.parse(localStorage.getItem('devitka-i') || '{}'); } catch (e) {}

  // deska je odemčená, když jsou doposlouchané všechny předchozí v PORADI
  function odemcena(klic) {
    if (vse) return true;
    var i = PORADI.indexOf(klic);
    for (var j = 0; j < i; j++) { if (!stav[PORADI[j]]) return false; }
    return true;
  }

  var prvniZamcena = null;
  for (var i = 0; i < PORADI.length; i++) {
    if (!odemcena(PORADI[i])) { prvniZamcena = PORADI[i]; break; }
  }

  var police = document.getElementById('police');
  var napoveda = document.getElementById('napoveda');
  var casovac;
  var hotovo = 0;

  POLICE.forEach(function (klic) {
    var p = document.createElement('div');
    var stavTridy;
    if (odemcena(klic)) { stavTridy = 'odemcena'; hotovo++; }
    else if (klic === prvniZamcena) { stavTridy = 'duch'; }
    else { stavTridy = 'zamcena'; }

    p.className = 'pozice ' + stavTridy;
    p.title = stavTridy === 'odemcena' ? NAZVY[klic] : '';
    p.innerHTML =
      '<div class="vinylek"></div>' +
      '<div class="obal"' + (stavTridy !== 'zamcena' ? ' style="background-image:url(' + klic + '-card.png)"' : '') + '></div>' +
      '<div class="razba"></div>' +
      '<svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>';

    p.addEventListener('click', function () {
      if (p.classList.contains('odemcena')) {
        location.href = 'karta-' + klic + '.html' + (vse ? '?vse' : '');
        return;
      }
      p.classList.remove('trese');
      void p.offsetWidth;
      p.classList.add('trese');
      napoveda.classList.add('ukaz');
      clearTimeout(casovac);
      casovac = setTimeout(function () { napoveda.classList.remove('ukaz'); }, 2600);
    });

    police.appendChild(p);
  });

  document.getElementById('pocitadlo').textContent =
    Math.min(Object.keys(stav).filter(function (k) { return stav[k]; }).length, 9) + ' / 9';
</script>
</body>
</html>
