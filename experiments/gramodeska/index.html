<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cello Cool Club — Gramotéka</title>
<style>
  :root{
    --bg:#14120f;
    --paper:#f3ecdd;
    --ink:#2a2419;
    --accent:#b9552e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:"Segoe UI",system-ui,sans-serif;
    min-height:100vh;
  }
  header{
    padding:26px 40px 14px;
    display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;justify-content:center;
  }
  header h1{
    font-size:15px;letter-spacing:.35em;text-transform:uppercase;font-weight:600;
  }
  header .sub{font-size:13px;opacity:.55;letter-spacing:.08em}

  /* ---------- police s deskami ---------- */
  #shelf{
    display:grid;
    grid-template-columns:repeat(3,min(21.5vh,300px));
    justify-content:center;
    gap:18px 26px;
    padding:10px 40px 30px;
  }
  .slot{cursor:pointer;position:relative}
  .slot .cover{
    position:relative;z-index:2;
    aspect-ratio:1;
    background:#000;
    box-shadow:0 10px 24px rgba(0,0,0,.55);
    transition:transform .25s ease;
  }
  .slot .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .slot .mini-disc{
    position:absolute;z-index:1;left:50%;top:0;width:78%;aspect-ratio:1;
    transform:translate(-50%,4%);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #222 0 18%, transparent 18.5%),
      repeating-radial-gradient(circle at 50% 50%, #111 0 2px, #1d1d1d 2px 4px);
    transition:transform .3s ease;
  }
  .slot:hover .cover{transform:translateY(-4px)}
  .slot:hover .mini-disc{transform:translate(-50%,-16%) rotate(20deg)}
  .slot .label{
    margin-top:8px;font-size:11.5px;letter-spacing:.04em;opacity:.75;
    display:flex;gap:8px;justify-content:space-between;white-space:nowrap;overflow:hidden;
  }
  .slot .label span:first-child{overflow:hidden;text-overflow:ellipsis}
  .slot .num{opacity:.5;font-variant-numeric:tabular-nums}

  /* ---------- detail ---------- */
  #detail{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(10,9,7,.9);
    backdrop-filter:blur(6px);
  }
  #detail.open{display:block}
  #stage{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  /* obal + deska */
  #combo{position:relative;height:min(76vh,640px);aspect-ratio:1}
  #sleeve{
    position:absolute;inset:0;z-index:3;cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,.1,.2,1);
  }
  #sleeve.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.7);
    overflow:hidden;
  }
  .face.front img{width:100%;height:100%;object-fit:cover;display:block}
  .face.back{
    transform:rotateY(180deg);
    background:var(--paper);color:var(--ink);
    padding:7% 8%;
    display:flex;flex-direction:column;
  }
  .back .head{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;gap:10px;
  }
  .back .head h2{
    font-family:Georgia,serif;font-size:clamp(15px,2.3vh,22px);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  }
  .back .cat{font-size:11px;letter-spacing:.15em;opacity:.6;white-space:nowrap}
  .back .poem{
    flex:1;overflow-y:auto;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(11px,1.75vh,15.5px);
    line-height:1.42;
    white-space:pre-line;
  }
  .back .foot{
    margin-top:12px;padding-top:10px;border-top:1px solid rgba(42,36,25,.35);
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;
  }
  .langs button{
    background:none;border:none;cursor:pointer;font:inherit;color:inherit;
    letter-spacing:.15em;padding:2px 6px;opacity:.45;
  }
  .langs button.on{opacity:1;border-bottom:2px solid var(--accent)}

  /* vinyl */
  #disc{
    position:absolute;z-index:1;top:50%;left:50%;
    height:88%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);
    transition:transform .7s cubic-bezier(.35,.1,.25,1);
    cursor:pointer;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.09), transparent 40%),
      repeating-radial-gradient(circle at 50% 50%, #0c0c0c 0 2px, #191919 2px 4px);
    box-shadow:0 18px 50px rgba(0,0,0,.65);
  }
  #detail.open #disc{transform:translate(18%,-50%)}
  #disc .spinner{
    position:absolute;inset:0;border-radius:50%;
  }
  #detail.playing #disc .spinner{animation:spin 1.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #disc .lab{
    position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);
    background-size:300%;background-position:center;
    border:3px solid #0c0c0c;
  }
  #disc .hole{
    position:absolute;left:50%;top:50%;width:3.5%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);background:var(--bg);
  }
  #disc .hint{
    position:absolute;left:64%;top:50%;transform:translate(-50%,-50%);
    color:#fff;opacity:.85;font-size:34px;text-shadow:0 2px 10px rgba(0,0,0,.8);
    pointer-events:none;transition:opacity .3s;
  }
  #detail.playing #disc .hint{opacity:0}

  /* ovladani detailu */
  #bar{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;
    font-size:12.5px;letter-spacing:.1em;opacity:.85;
  }
  #bar .time{font-variant-numeric:tabular-nums;opacity:.7}
  #bar button{
    background:none;border:1px solid rgba(243,236,221,.35);color:var(--paper);
    font:inherit;letter-spacing:.15em;padding:7px 16px;cursor:pointer;border-radius:20px;
  }
  #bar button:hover{border-color:var(--paper)}
  #close{
    position:absolute;top:22px;right:30px;z-index:60;
    background:none;border:none;color:var(--paper);font-size:30px;cursor:pointer;opacity:.7;
  }
  #close:hover{opacity:1}
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:60;
    background:none;border:none;color:var(--paper);font-size:44px;cursor:pointer;opacity:.35;
    padding:20px;
  }
  .nav:hover{opacity:.9}
  #prev{left:6px} #next{right:6px}

  @media (max-width:720px){
    #combo{height:auto;width:86vw;max-width:420px}
    #detail.open #disc{transform:translate(-50%,8%)}
    header{padding:24px 20px 10px}
    #shelf{padding:16px 20px 50px;gap:24px 16px}
  }
</style>
</head>
<body>
<header>
  <h1>Cello Cool Club · Gramotéka</h1>
  <span class="sub" id="count"></span>
  <span class="sub">klik na obal = otočit · klik na desku = hrát</span>
</header>

<div id="shelf"></div>

<div id="detail">
  <button id="close" title="Zavřít (Esc)">×</button>
  <button class="nav" id="prev" title="Předchozí">‹</button>
  <button class="nav" id="next" title="Další">›</button>
  <div id="stage">
    <div id="combo">
      <div id="disc" title="Přehrát / pauza">
        <div class="spinner">
          <div class="lab"></div>
          <div class="hole"></div>
        </div>
        <div class="hint">▶</div>
      </div>
      <div id="sleeve" title="Otočit obal">
        <div class="face front"><img alt=""></div>
        <div class="face back">
          <div class="head"><h2></h2><span class="cat"></span></div>
          <div class="poem"></div>
          <div class="foot">
            <span>Cello Cool Club</span>
            <span class="langs">
              <button data-l="cs">CZ</button><button data-l="en">EN</button><button data-l="fr">FR</button>
            </span>
            <span>33⅓ rpm</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="bar">
    <button id="playBtn">▶ Přehrát</button>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
</div>

<script src="records.js"></script>
<script>
const $ = s => document.querySelector(s);
let cur = -1, lang = 'cs';
const audio = new Audio();
const detail = $('#detail');

const SHOWN = RECORDS.slice(0, 9);
$('#count').textContent = SHOWN.length + ' desek';

/* police */
const shelf = $('#shelf');
SHOWN.forEach((r, i) => {
  const d = document.createElement('div');
  d.className = 'slot';
  d.innerHTML = `
    <div class="mini-disc"></div>
    <div class="cover"><img loading="lazy" src="${r.poster}" alt="${r.title}"></div>
    <div class="label"><span>${r.title}</span><span class="num">CCC-${r.poemNumber || r.canon}</span></div>`;
  d.onclick = () => open(i);
  shelf.appendChild(d);
});

function fmt(t){ if(!isFinite(t)) return '–:––'; t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }

function renderPoem(r){
  const l = r.poem[lang] ? lang : 'en';
  $('.back h2').textContent = (r.titles && r.titles[l]) || r.title;
  $('.back .poem').textContent = r.poem[l].join('\n');
  document.querySelectorAll('.langs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.l === l);
    b.style.display = r.poem[b.dataset.l] ? '' : 'none';
  });
}

function open(i){
  cur = i;
  const r = SHOWN[i];
  stop();
  $('#sleeve').classList.remove('flipped');
  $('.face.front img').src = r.poster;
  $('.back .cat').textContent = 'CCC-' + (r.poemNumber || r.canon);
  $('#disc .lab').style.backgroundImage = `url("${r.poster}")`;
  renderPoem(r);
  audio.src = r.audio;
  detail.classList.add('open');
  $('#time').textContent = '0:00 / 0:00';
}

function close(){ detail.classList.remove('open'); stop(); }
function stop(){ audio.pause(); audio.currentTime = 0; setPlaying(false); }
function setPlaying(on){
  detail.classList.toggle('playing', on);
  $('#playBtn').textContent = on ? '❚❚ Pauza' : '▶ Přehrát';
}
function toggle(){
  if (audio.paused) audio.play().then(()=>setPlaying(true)).catch(()=>{});
  else { audio.pause(); setPlaying(false); }
}

$('#sleeve').onclick = () => $('#sleeve').classList.toggle('flipped');
$('#disc').onclick = toggle;
$('#playBtn').onclick = toggle;
$('#close').onclick = close;
$('#prev').onclick = () => open((cur - 1 + SHOWN.length) % SHOWN.length);
$('#next').onclick = () => open((cur + 1) % SHOWN.length);
detail.addEventListener('click', e => { if (e.target === detail || e.target === $('#stage')) close(); });
document.querySelectorAll('.langs button').forEach(b => b.onclick = e => {
  e.stopPropagation(); lang = b.dataset.l; renderPoem(SHOWN[cur]);
});
audio.ontimeupdate = () => $('#time').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
audio.onended = () => setPlaying(false);
document.addEventListener('keydown', e => {
  if (!detail.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') $('#prev').click();
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'f') $('#sleeve').classList.toggle('flipped');
});

/* testovaci parametry: ?open=0&flip=1 */
const q = new URLSearchParams(location.search);
if (q.has('open')) {
  open(+q.get('open') || 0);
  if (q.get('flip')) $('#sleeve').classList.add('flipped');
}
</script>
</body>
</html>
