<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devítka I — police</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --papir: #ecdfc0;
    --papir-tmavy: #ddcda8;
    --papir-svetly: #f4ecd8;
    --inkoust: #453626;
    --inkoust-svetly: #6d5c44;
    --oliva: #6b6840;
    --vinyl: #1c1815;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #35302a;
    min-height: 100vh;
    overflow: hidden;
    font-family: "EB Garamond", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
  }

  /* ---------- záhlaví setu ---------- */
  .zahlavi {
    text-align: center;
    color: rgba(236,224,196,.85);
    user-select: none;
  }
  h1 {
    font-weight: 500;
    font-size: clamp(20px, 3.2vh, 30px);
    letter-spacing: .24em;
    text-indent: .24em;
    font-variant: small-caps;
  }
  .pocitadlo {
    margin-top: .6vh;
    font-size: clamp(12px, 1.7vh, 16px);
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(236,224,196,.5);
  }

  /* ---------- police 3×3 ---------- */
  .police {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 2.6vh;
  }

  .pozice {
    position: relative;
    height: 24vh;
    aspect-ratio: 687 / 1024;
    border-radius: 5px;
    cursor: pointer;
    transition: transform .3s ease;
  }

  /* deska vykukující za obalem (jen odemčené) */
  .pozice .vinylek {
    position: absolute;
    top: 50%;
    right: -9%;
    width: 78%;
    aspect-ratio: 1;
    transform: translateY(-50%);
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle,
        var(--vinyl) 0 1.6px,
        #262019 1.6px 2px,
        var(--vinyl) 2px 3.6px);
    box-shadow: 3px 0 12px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(236,224,196,.14);
    transition: right .4s ease;
  }
  .pozice:hover .vinylek { right: -16%; }

  .obal {
    position: absolute;
    inset: 0;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 3px 9px rgba(0,0,0,.35);
    background-color: var(--papir-tmavy);
  }
  /* hrana kapsy vpravo */
  .obal::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 7px;
    background: linear-gradient(to left, rgba(0,0,0,.28), transparent);
  }

  .pozice:hover { transform: translateY(-6px); }

  /* --- odemčená: plný plakát --- */
  .pozice.odemcena .obal { background-position: center; background-size: cover; }

  /* --- duch: další na řadě, prosvítá --- */
  .pozice.duch .obal {
    background-position: center;
    background-size: cover;
  }
  .pozice.duch .obal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(236,223,192,.82);
    backdrop-filter: blur(3px) grayscale(1);
  }

  /* --- zamčená: slepý obal, jen ražba --- */
  .pozice.zamcena .obal {
    background:
      radial-gradient(ellipse at 32% 12%, rgba(255,250,235,.5), transparent 60%),
      radial-gradient(ellipse at 82% 92%, rgba(120,95,55,.14), transparent 55%),
      var(--papir-tmavy);
  }
  /* slepá ražba: kolečko labelu + ornament */
  .razba {
    position: absolute;
    left: 50%; top: 44%;
    width: 46%;
    aspect-ratio: 1;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    box-shadow:
      inset 1.5px 1.5px 3px rgba(120,95,55,.4),
      inset -1.5px -1.5px 3px rgba(255,250,235,.65),
      1px 1px 2px rgba(255,250,235,.5);
  }
  .razba::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 12%;
    aspect-ratio: 1;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    box-shadow:
      inset 1px 1px 2px rgba(120,95,55,.45),
      inset -1px -1px 2px rgba(255,250,235,.6);
  }
  .pozice.zamcena svg.ornament,
  .pozice.duch svg.ornament {
    position: absolute;
    left: 50%; bottom: 9%;
    transform: translateX(-50%);
    width: 55%;
    height: 12px;
    color: rgba(109,92,68,.5);
  }

  /* jemné zatřesení při kliku na zamčenou */
  @keyframes zatres {
    0%,100% { transform: translateY(-6px) rotate(0); }
    25% { transform: translateY(-6px) rotate(-1.2deg); }
    75% { transform: translateY(-6px) rotate(1.2deg); }
  }
  .pozice.trese { animation: zatres .35s ease; }

  /* ---------- nápověda dole ---------- */
  .napoveda {
    min-height: 2.6vh;
    font-style: italic;
    font-size: clamp(12px, 1.8vh, 16px);
    color: rgba(236,224,196,.55);
    opacity: 0;
    transition: opacity .4s;
    user-select: none;
  }
  .napoveda.ukaz { opacity: 1; }
</style>
</head>
<body>

  <header class="zahlavi">
    <h1>Devítka I</h1>
    <div class="pocitadlo">2 / 9</div>
  </header>

  <div class="police">

    <!-- 1: odemčená — Mléčný zub, vede na LP prototyp -->
    <div class="pozice odemcena" data-href="deska-mlecny-zub.html" title="Mléčný zub">
      <div class="vinylek"></div>
      <div class="obal" style="background-image:url(mlecny-zub-born.png)"></div>
    </div>

    <!-- 2: odemčená — Slepé střevo (zástupný plakát) -->
    <div class="pozice odemcena" title="Slepé střevo">
      <div class="vinylek"></div>
      <div class="obal" style="background-image:url(slepe-strevo-5-born-ref.png)"></div>
    </div>

    <!-- 3: duch — další na řadě, prosvítá pod papírem -->
    <div class="pozice duch">
      <div class="obal" style="background-image:url(slepe-strevo-4-born-text.png)"></div>
      <div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1">
        <line x1="0" y1="7" x2="58" y2="7"/>
        <path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/>
        <line x1="92" y1="7" x2="150" y2="7"/>
      </svg>
    </div>

    <!-- 4–9: zamčené slepé obaly -->
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>
    <div class="pozice zamcena"><div class="obal"></div><div class="razba"></div>
      <svg class="ornament" viewBox="0 0 150 14" fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="7" x2="58" y2="7"/><path d="M70 3 q2 -2 4 0 q1 1 1 3 q0 4 -2 6 q-1 1 -1.5 -1 q-.5 2 -1.5 1 q-2 -2 -2 -6 q0 -2 1 -3 z" transform="translate(1,0)"/><line x1="92" y1="7" x2="150" y2="7"/></svg>
    </div>

  </div>

  <div class="napoveda" id="napoveda">další deska se odemkne, až doposloucháš tu předchozí</div>

<script>
  var napoveda = document.getElementById('napoveda');
  var casovac;

  document.querySelectorAll('.pozice').forEach(function (p) {
    p.addEventListener('click', function () {
      if (p.classList.contains('odemcena')) {
        if (p.dataset.href) location.href = p.dataset.href;
        return;
      }
      // zamčená / duch: zatřese a ukáže nápovědu
      p.classList.remove('trese');
      void p.offsetWidth;
      p.classList.add('trese');
      napoveda.classList.add('ukaz');
      clearTimeout(casovac);
      casovac = setTimeout(function () { napoveda.classList.remove('ukaz'); }, 2600);
    });
  });
</script>
</body>
</html>
