<script id="data" type="application/json">{"collection":{"slug":"barvy","title":"Barvy","subtitle":"Osm barev, osm vlastních hlasů","ids":["245","1016","231","229","232","230","228","233"]},"collections":[{"slug":"novy-vyber","title":"Další příběhy"},{"slug":"oblibene","title":"Tvůj výběr"},{"slug":"barvy","title":"Barvy"}],"records":[{"posterSet":"","id":"245","title":"White, the Color of Everything and Nothing","cs":"Bílá · všechno a nic","color":"#ede4d1","poem":["They say I am not a color","That I am the absence, the blank page, the great nothing","But it is I who begins everything","I am the milk of the world's first morning","The first tooth of a smiling child","The fresh snow that offers forgiveness to a dirty city","I am the bride's dress full of fragile promises","And the blank page of the new notebook where everything is still possible","I am the dove of peace that does not exist","And the sail of the boat leaving for the horizon","I am innocence and the beginning","The first word of a poem","But I am also the other thing","The thing one does not speak of","I am the white wall of the hospital that smells of fear","The white flag of the lost battle","The white silence after the scream","I am the bone polished by time and vultures","The blinding white light of the interrogation","And the white face of the returning ghost","I am the void and the end","The last word of an erased poem","I am the best and the worst","The nuptial bed and the shroud","The cloud where one sees an angel's face","And the fog where one gets lost forever","I am the sugar and the salt","The feather and the ash","I do not choose a side","I am just there, before and after","The great silence where all colors are born","And where all colors die."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, medium gospel-blues swing with a steady walking pulse, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/84.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"1016","title":"Black, the Color of Secrets","cs":"Černá · tajemství","color":"#514a45","poem":["They say I am the color of mourning","The end of everything, the great hole","The twin brother of nothingness","They say I absorb the light","As if it were a crime","But they forget","That I am the rich and deep earth","Where the seed begins its journey to the sun","I am the immense and velvety night sky","Without me one would never see the moon or the stars","I am the pupil of the eye","The little round door through which all beauty enters","I am the ink that gives a body to poems","The musical note on the white page","The respectful silence in the movie theater","Before the dream begins","I am the coal that carries the fire","And the coffee that awakens sad mornings","I am the color of independent cats","Of anarchists and of poets","The color of simple elegance","And of well-kept secrets","I am the refuge of the shadow","Where lovers can hide to love each other","Of course, I am also the color of fear","Of the storm cloud full of anger","Of the locked door","And of the moonless night","But I am not the void","I am the mystery of that which is full","I am not the end of everything","I am just the other side of the light","White is the question","I am the depth of the answer","We are the two sides of the same coin","The day and the night","The poem and the page","And one without the other","Would tell no story at all."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with a single warm female lead voice, strictly one warm female lead singer throughout, solo vocal only, monophonic vocal line, no choir, no backing vocals, no vocal harmonies, no vocal layering or doubling, no duet, no call-and-response vocals, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, mid-tempo bolero-jazz sway with a romantic pulse, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, quiet city-at-night atmosphere, tender saxophone responses, resilient dignity, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/85.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"231","title":"Red, the Color of the Heart","cs":"Červená · srdce","color":"#bc635c","poem":["After the silence of white and black","I arrive making noise","I am the first color, the great scream","The color that even the blind can feel","The warmth of blood on the skin","I am the color of life and of desire","The cherry that one steals from the tree","The lips of a woman waiting for a kiss","The fragile and stubborn poppy in the wheat field","The heart drawn in chalk on a gray wall","I am the wine of lovers and the blush of shyness","The blood that runs in the veins","The proof that one is alive","But I am also the color of anger and of war","The fire that devours the house","The blood that flows on the pavement","The face of an angry man","The teacher's pen that crosses out mistakes","The stop sign that kills movement","And the flag of the revolution","That promises a better world","With the blood of others","I am a paradox, a wound and a flower","The most joyful and the most terrible of colors","I am the velvet curtain of the theater","And the stain on the butcher's apron","I am the candy apple of the funfair","And the light of the brothel in the night","You cannot ignore me","I am the color of all passions","From love to hate there is only one step","And that step is always red","A world without me would be a reasonable world","A gray and polite world","A deathly boring world."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, mid-tempo bolero-jazz sway with a romantic pulse, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/86.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"229","title":"Orange, the Color of Twilight","cs":"Oranžová · soumrak","color":"#ca925c","poem":["I am not the scream of red","Nor the great laughter of yellow","I am their friendly conversation","A kind color that doesn't want to make a scene","I am the warmth of a wood fire in the fireplace","I am the color of simple and good things","The carrot that one pulls from the earth","The apricot full of sun","And the orange, that little sun to be peeled","Full of a sweet juice that sticks to the fingers","I am the round belly of the pumpkin","Waiting quietly for autumn in its field","And the color of the fox disappearing into the woods","I am the color of the end of the day","The great magnificent farewell of the sun","Its golden wound on the belly of the sky","I am the light of the little lamp on the table","When the night is already behind the window","I am a promise of warmth and of refuge","But I am also the color of warning","The flashing light of the road workers","The plastic cone that says \"Caution, danger\"","The jacket of the garbage collector that makes him visible in the night","I am the color that forewarns","The color of prudence and of change","For I am above all the color of autumn","The sad beauty of the leaf that is about to fall","The last warmth before the great cold","I am not an eternal color","I am the color of a moment","A perfect and fragile moment","Between fullness and the end","I am the color of a friendly \"goodbye for now\"","Never that of a \"farewell\"."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, medium rolling travel swing, not a ballad, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/87.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"232","title":"Yellow, the Color of Laughter","cs":"Žlutá · smích","color":"#d4b45f","poem":["I am the color of laughter and of the sun","The not-so-rich cousin of gold","I am simple joy, a color without manners","That bursts forth in the middle of the serious green of the meadow","A million dandelions applauding the spring","I am the sharp and sour taste of the lemon","The heat of mustard that rushes to the nose","The liquid heart of a fried egg","I am the naive sunflower that follows its god the sun","And the raincoat of a child jumping in puddles","I am a party, a surprise, an exclamation","But you must not trust my smile","I am also a color that lies","The color of sickness on a man's skin","The yellow and feverish light of a tired lightbulb","The pages of an old book that are slowly dying","I am the color of betrayal and of cowardice","At the crossroads I am the middle light","The one that is neither yes nor no","The one that says \"Careful, maybe danger\"","I am the desert sand where one dies of thirst","And the fake gold of a cheap ring","That leaves a green trace on the finger","I am joy, but a joy that knows it does not last","The beauty of summer just before autumn","A laughter that is on the verge of tears","I am the most cheerful and the most unsettling of colors","A flash of light","Before the shadow comes to take it all back."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, mid-tempo bolero-jazz sway with a romantic pulse, warm, hopeful, lightly cheerful mood, brighter brass colors, smiling piano fills, buoyant brushed drums, quiet city-at-night atmosphere, tender saxophone responses, resilient dignity, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/88.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"230","title":"Green, the Color of Hope","cs":"Zelená · naděje","color":"#79a780","poem":["I am not a hurried color","I am patience, I am perseverance","The little blade of grass that grows through the concrete","The ivy that slowly climbs the wall of time","I am the great quiet breath of the forests","I am the color of hope","The first bud on the dead tree of winter","The four-leaf clover found by a child","The green light at the crossroads that says \"Go, live your life\"","I am the fresh mint in a glass of water","The little motionless lizard on the warm stone","And the deep green of a mountain lake","I am the repose of the eye and the calm of the heart","The promise that even after the harshest of winters","Life always returns","But men have invented another life for me","Another color","They took my name to put it on their money","That paper that buys everything except happiness","They put me on the uniforms of their soldiers","And on the gambling table where fortunes are lost","I have become the color of jealousy","The murky green of envy in the eyes","The color of absinthe that drives one mad","And of the mold on forgotten bread","They have created a green that is the enemy of life","A green of poison, a green of dollars, a green of profit","A green that builds walls","While my own true green","Only dreams of covering them","So look closely","There are two greens in the world","The one that liberates and the one that imprisons","And every day you must choose","Between the grass in the park where you can lie down to do nothing","And the banknote you must earn to survive."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, mid-tempo bolero-jazz sway with a romantic pulse, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/89.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"228","title":"Blue, the Color of Dreams","cs":"Modrá · sny","color":"#749ebe","poem":["I am not a color that screams","I am a great murmur, a sigh","The color of that which is far away","The horizon, the sea, and the vein on a hand","I am the color of escape","The immense sky that belongs to no one","And where the birds draw poems of freedom","I am the deep ocean full of voyages and monsters","The liquid road to unknown islands","I am the uniform of the sailor who is leaving","And the color of the eyes in which one drowns in love","I am the color of dreams and of hope","The blue smoke of a wood fire rising to the stars","The ink of the letter one is waiting for","And the little flame of the gas in the silent night","But I am also the color of sorrow","The \"blues\" of the black musician in a Chicago bar","The color of lips when one is cold","The terrible blue of a bruise on the skin and on the soul","I am the color of the work uniform","The \"bleu de travail\" that smells of sweat and fatigue","The faded blue of a life spent in a factory","Looking at the sky through a dirty window","I am the greatest of paradoxes","The color of the cage and of freedom","I am the blue of the worker's overalls","And the blue of the sky he looks at while dreaming","I am the distance between what one is","And what one would like to be","I am the color of the human soul","A great sea of desires and of melancholy."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, uptempo swing with playful stop-time breaks, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/90.mp3"}],"posters":[],"pilot":false},{"posterSet":"","id":"233","title":"Purple, the Color of Magic","cs":"Fialová · kouzla","color":"#ac88b2","poem":["I am not a simple color I was born in an alchemist's cauldron From the marriage of the blood of red and the dream of blue I am the color of things that happen only once","I am the color of magic and of deep secrets The smoke that escapes from a sorcerer's vial The robe of a king who speaks to the stars And the invisible ink that reveals a treasure map I am the color of the hour between dog and wolf That moment when anything can still happen When a pumpkin can become a carriage","I am the heavy scent of incense in an old church The taste of a wild blackberry picked from the brambles The last note of a sad song that lingers in the air I am a color of luxury and of meditation","But I am not only in palaces I am also in humble and bruised things The little wild pansy with its golden heart The color of a bruise that is slowly healing The memory of a small pain I am the shadow under the eyes of someone who has dreamed too much And the vein of amethyst hidden in the rough rock","I am a noble color and a wounded color A miracle and a scar The color of mystery and of intuition When you see me in the depths of a dream Know that it is the door to another world A world where logic has taken a vacation","I am the color that exists just before falling asleep The last bridge before the great journey of the night The promise that the world is stranger And more beautiful than it seems."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, uptempo swing with playful stop-time breaks, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, quiet city-at-night atmosphere, tender saxophone responses, resilient dignity, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/91.mp3"}],"posters":[],"pilot":false}]}</script>
<script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWord=(n,one,few,many)=>n+' '+(n===1?one:n>=2&&n<=4?few:many);
const key='ccc-review-picks-v1';let picked=new Set();try{picked=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
$('nav').innerHTML=D.collections.map(c=>`<a href="/${c.slug}.html" ${c.slug===D.collection.slug?'aria-current="page"':''}>${esc(c.title)}</a>`).join('');$('h1').textContent=D.collection.title;$('.sub').textContent=D.collection.subtitle;
$('#cards').innerHTML=D.records.map((r,i)=>`<details class="card" data-id="${r.id}" ${i===0?'open':''} style="--accent:${r.color}"><summary><span class="arrow" aria-hidden="true">›</span>${r.posters.length?`<img class="cover" src="${r.posters[0].thumb}" alt="" loading="lazy">`:`<div class="cover swatch" aria-hidden="true"><span></span></div>`}<div class="titles"><h2>${esc(r.title)}</h2><small>${esc(r.cs)} · karta ${r.id}</small></div><div class="chips">${r.pilot&&D.collection.slug==='novy-vyber'?'<span class="chip pilot">Koncertní pilot</span>':''}<span class="chip">${countWord(r.audio.length,'nahrávka','nahrávky','nahrávek')}</span><span class="chip">${r.posters.length?countWord(r.posters.length,'poster','postery','posterů'):'Poster zatím chybí'}</span></div></summary><div class="body"><div><h3>Poslech</h3>${r.audio.map(a=>`<div class="audioLabel">${esc(a.label)}</div><audio controls preload="none" src="${a.url}" aria-label="${esc(r.title+' — '+a.label)}"></audio>`).join('')||'<p>Nahrávka zatím chybí.</p>'}<button class="pick" data-pick="${r.id}" aria-pressed="${picked.has(r.id)}">${picked.has(r.id)?'Označeno ✓':'Označit pro další práci'}</button><details class="smallDetails"><summary>Text básně ▾</summary><div class="poem">${esc(r.poem.join('\n'))}</div></details><details class="smallDetails"><summary>Hudební zadání ▾</summary><div class="prompt">${esc(r.prompt||'Zadání není uložené.')}</div></details></div><div><h3>Postery</h3>${r.posterSet?`<p class="audioLabel">${esc(r.posterSet)}</p>`:""}${r.posters.length?`<div class="images">${r.posters.map(p=>`<button class="poster" data-full="${p.url}" data-title="${esc(r.title+(p.label?' · '+p.label:''))}" aria-label="Zvětšit poster ${esc(r.title)}"><img src="${p.thumb}" alt="Poster k ${esc(r.title)}${p.label?' — '+esc(p.label):''}" loading="lazy">${p.label?`<span>${esc(p.label)}</span>`:''}</button>`).join('')}</div>`:'<div class="missing">K této básni zatím není přiřazený poster.</div>'}</div></div></details>`).join('');
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filter(){const q=norm($('#search').value);let n=0;document.querySelectorAll('.card').forEach(el=>{const r=D.records.find(r=>r.id===el.dataset.id);el.hidden=!(norm(r.title+' '+r.cs+' '+r.id).includes(q)&&(!$('#only').checked||picked.has(r.id)));if(!el.hidden)n++});$('.result').textContent=`${n} z ${D.records.length} skladeb · ${D.records.filter(r=>r.posters.length).length} s postery · ${D.records.filter(r=>picked.has(r.id)).length} označeno`;$('#empty').hidden=n>0}
$('#search').addEventListener('input',filter);$('#only').addEventListener('change',filter);$('#expand').onclick=()=>document.querySelectorAll('.card:not([hidden])').forEach(d=>d.open=true);$('#collapse').onclick=()=>document.querySelectorAll('.card').forEach(d=>d.open=false);$('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
document.addEventListener('error',e=>{if(e.target.tagName==='AUDIO')$('#notice').textContent='Tuto nahrávku se nepodařilo načíst. Zkontroluj, že běží místní server.'},true);
document.addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){const id=pick.dataset.pick;picked.has(id)?picked.delete(id):picked.add(id);try{localStorage.setItem(key,JSON.stringify([...picked]))}catch{$('#notice').textContent='Prohlížeč neumožnil uložení. Výběr můžeš stáhnout tlačítkem Uložit výběr.'}pick.setAttribute('aria-pressed',picked.has(id));pick.textContent=picked.has(id)?'Označeno ✓':'Označit pro další práci';filter()}const poster=e.target.closest('[data-full]');if(poster){$('dialog img').src=poster.dataset.full;$('dialog img').alt=poster.dataset.title;$('dialog .top span').textContent=poster.dataset.title;$('dialog').showModal()}});
$('#close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close()});
$('#export').onclick=()=>{const list=D.records.filter(r=>picked.has(r.id));if(!list.length){$('#notice').textContent='Nejprve označ alespoň jednu skladbu.';return}const b=new Blob(['# '+D.collection.title+'\n\n'+list.map(r=>'- '+r.id+' — '+r.title).join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=D.collection.slug+'-vyber.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};filter();
</script></body></html>
