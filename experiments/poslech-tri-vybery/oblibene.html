<script id="data" type="application/json">{"collection":{"slug":"oblibene","title":"Tvůj výběr","subtitle":"Deset oblíbených příběhů","ids":["157","1074","993","055","1081","370","288","372","435","395"]},"collections":[{"slug":"novy-vyber","title":"Další příběhy"},{"slug":"oblibene","title":"Tvůj výběr"},{"slug":"barvy","title":"Barvy"}],"records":[{"posterSet":"","id":"157","title":"The Last Word","cs":"Poslední slovo","color":"#cda56d","poem":["The old man was on his deathbed","His family was around him","The priest spoke to him of paradise","The doctor spoke to him of morphine","Everyone was waiting for his last word","The word that would sum up his life","The word of wisdom for posterity","The old man opened his eyes","He looked at his wife his son his daughter his dog","He looked at the priest and the doctor","He took a deep breath","And he said","Damn","Then he died","The family was shocked","The priest was scandalized","The doctor noted the time of death","Only the dog understood","He wagged his tail","For 'Damn' was the word the old man said","When he was truly happy","And couldn't find a word big enough to say it."],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, medium noir swing with a stealthy pulse, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/14.mp3"},{"label":"Live · 1920","url":"/media/15.mp3"}],"posters":[{"label":"Plakát A · Live","url":"/media/16.png","thumb":"/thumbs/157-0.jpg","source":"experiments/cards-live/157-le-dernier-mot/poster-A.png"},{"label":"","url":"/media/17.png","thumb":"/thumbs/157-1.jpg","source":"experiments/cards-live/157-le-dernier-mot/poster-B.png"},{"label":"Plakát C · Live","url":"/media/18.png","thumb":"/thumbs/157-2.jpg","source":"experiments/cards-live/157-le-dernier-mot/poster-C.png"}],"pilot":false},{"posterSet":"","id":"1074","title":"The Boy and the Echo","cs":"Chlapec a ozvěna","color":"#cda56d","poem":["A boy stands at the edge of the valley","small against the mountains","and the mountains are big","and say nothing","And because he was scolded that morning","and because he is seven","and the world is unfair","he takes a breath","and shouts into the valley","YOU IDIOT","And the valley takes a breath","and gives it back","idiot idiot idiot","three times four times","once from every side","The boy sits down in the grass","and cries","grandpa the mountains don't like me","they call me names","did you hear?","Grandpa sits down beside him","pipe smoke rising straight","like a proper upbringing","Try telling them something else","he says","mountains repeat","they can't make anything up","they are only big","The boy stands up","wipes his nose on his sleeve","breathes in down to his boots","and shouts","I LOVE YOU","And the valley gives it back","I love you I love you I love you","once from every side","and then once more","and it keeps on saying it","long into the evening","the world is one big echo","it gives you back","whatever you call into it"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with a single warm female lead voice, strictly one warm female lead singer throughout, solo vocal only, monophonic vocal line, no choir, no backing vocals, no vocal harmonies, no vocal layering or doubling, no duet, no call-and-response vocals, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, mid-tempo bolero-jazz sway with a romantic pulse, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/19.mp3"},{"label":"Live · 1920","url":"/media/20.mp3"},{"label":"Live · 1930","url":"/media/21.mp3"},{"label":"Live · 1940","url":"/media/22.mp3"}],"posters":[{"label":"Plakát A · Live","url":"/media/23.png","thumb":"/thumbs/1074-0.jpg","source":"experiments/cards-live/1074-the-boy-and-the-echo/poster-A.png"},{"label":"","url":"/media/24.png","thumb":"/thumbs/1074-1.jpg","source":"experiments/cards-live/1074-the-boy-and-the-echo/poster-B.png"},{"label":"Plakát C · Live","url":"/media/25.png","thumb":"/thumbs/1074-2.jpg","source":"experiments/cards-live/1074-the-boy-and-the-echo/poster-C.png"},{"label":"","url":"/media/26.png","thumb":"/thumbs/1074-3.jpg","source":"experiments/cards-live/1074-the-boy-and-the-echo/poster-video.png"}],"pilot":false},{"posterSet":"","id":"993","title":"The Forgotten Umbrella","cs":"Zapomenutý deštník","color":"#cda56d","poem":["Mr. Smith bought himself an umbrella","a solid black umbrella","so he would never get wet","and the very first Tuesday","he left it on the train to Oxford","","The umbrella travelled on","in Oxford a student took it","and under it she kissed a boy","she was not supposed to kiss","and left it in a café","","In the café a violinist took it","and played beneath it at the station","when rain fell on his sheet music","then he lent it to a bride","whose veil was catching the rain","and the bride left it in a taxi","and the taxi drove it all the way to the sea","","And so the umbrella saw Oxford","a kiss that wasn't allowed to be","notes washed out by rain","a wedding","and the sea","","Mr. Smith bought a new umbrella","an even more solid one","and so as not to lose it again","he kept it at home","and when it rained","he stayed home with it","","The umbrella saw the world","because it got lost","Mr. Smith saw nothing","because he was afraid of getting lost"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with a single warm female lead voice, solo vocal only, one single lead singer throughout, monophonic vocal line, no choir, no backing vocals, no vocal harmonies, no vocal layering or doubling, no duet, no call-and-response vocals, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, uptempo swing with playful stop-time breaks, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, walking-street groove, brushed snare like footsteps, muted trumpet prayer responses, damp pavement atmosphere, wry sacred-comic vocal delivery, tender urban melancholy, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/27.mp3"}],"posters":[{"label":"Plakát A","url":"/media/28.png","thumb":"/thumbs/993-0.jpg","source":"experiments/cards/993-the-forgotten-umbrella/poster-A.png"},{"label":"","url":"/media/29.png","thumb":"/thumbs/993-1.jpg","source":"experiments/cards/993-the-forgotten-umbrella/poster-B.png"},{"label":"Plakát C","url":"/media/30.png","thumb":"/thumbs/993-2.jpg","source":"experiments/cards/993-the-forgotten-umbrella/poster-C.png"},{"label":"","url":"/media/31.png","thumb":"/thumbs/993-3.jpg","source":"experiments/cards/993-the-forgotten-umbrella/poster-video.png"},{"label":"Plakát ze sbírky","url":"/media/32.png","thumb":"/thumbs/993-4.jpg","source":"assets/posters/002-the-forgotten-umbrella.png"}],"pilot":false},{"posterSet":"","id":"055","title":"The Thief of Sleep","cs":"Zloděj spánku","color":"#cda56d","poem":["He does not steal money","he steals sleep","At night he slips into bedrooms","making no sound at all","and takes the sleep from people","stuffing it into a great sack","In the morning people wake up weary","with dark shadows under their eyes","they do not know their rest has been stolen","The thief goes home","and gives the stolen sleep","to his little sick daughter","who cannot rest because of the pain","She drifts off at last","with a smile","And the thief watches her","his heart heavy","with being both","a criminal and a savior"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, buoyant carousel swing in a circling 6/8 feel, bright piano, upright bass, brushed drums, playful clarinet and small brass, warm smiling female vocal, repeating melodic figure that keeps returning without frustration, childlike momentum and barrel-organ color translated into elegant jazz, joyful freedom in running nowhere, finish still in motion, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/33.mp3"},{"label":"Live · 1920","url":"/media/34.mp3"}],"posters":[{"label":"Plakát A","url":"/media/35.png","thumb":"/thumbs/055-0.jpg","source":"experiments/cards/055-the-thief-of-sleep/poster-A.png"},{"label":"","url":"/media/36.png","thumb":"/thumbs/055-1.jpg","source":"experiments/cards/055-the-thief-of-sleep/poster-B.png"},{"label":"Plakát C","url":"/media/37.png","thumb":"/thumbs/055-2.jpg","source":"experiments/cards/055-the-thief-of-sleep/poster-C.png"},{"label":"","url":"/media/38.png","thumb":"/thumbs/055-3.jpg","source":"experiments/cards/055-the-thief-of-sleep/poster-video.png"},{"label":"Plakát A · Live","url":"/media/39.png","thumb":"/thumbs/055-4.jpg","source":"experiments/cards-live-2/055-the-thief-of-sleep/poster-A.png"},{"label":"","url":"/media/40.png","thumb":"/thumbs/055-5.jpg","source":"experiments/cards-live-2/055-the-thief-of-sleep/poster-B.png"},{"label":"Plakát C · Live","url":"/media/41.png","thumb":"/thumbs/055-6.jpg","source":"experiments/cards-live-2/055-the-thief-of-sleep/poster-C.png"}],"pilot":false},{"posterSet":"Sada Five Story Posters · všechny 4 obrazy","id":"1081","title":"The Weather Announcer","cs":"Hlasatel počasí","color":"#cda56d","poem":["Every morning","into the microphone","sunny","and clear","with patches of blue","Good morning all","it will be lovely","he says","and people reach","for their sunglasses","And he","under the desk","against his foot","keeps an umbrella","always","every day","The forecast","is hope","for the others","the umbrella","is experience","for him","He broadcasts sunshine","he sends out warmth","he hands round blue","for free","into every kitchen","And he himself","when he steps outside","opens his umbrella","and is not surprised","almost ever","Because between","hope","and experience","usually","very softly","it rains","But he will never say it","into the microphone","people need","to hear it will be fine","someone at least","must say it out loud"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with a single warm female lead voice, strictly one warm female lead singer throughout, solo vocal only, monophonic vocal line, no choir, no backing vocals, no vocal harmonies, no vocal layering or doubling, no duet, no call-and-response vocals, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, uptempo swing with playful stop-time breaks, warm, hopeful, lightly cheerful mood, brighter brass colors, smiling piano fills, buoyant brushed drums, quiet city-at-night atmosphere, tender saxophone responses, resilient dignity, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/42.mp3"},{"label":"Live · 1920","url":"/media/43.mp3"},{"label":"Live · 1930","url":"/media/44.mp3"},{"label":"Live · 1940","url":"/media/45.mp3"}],"posters":[{"label":"Plakát A","url":"/media/46.png","thumb":"/thumbs/1081-0.jpg","source":"experiments/cards/1081-the-weather-announcer/poster-A.png"},{"label":"","url":"/media/47.png","thumb":"/thumbs/1081-1.jpg","source":"experiments/cards/1081-the-weather-announcer/poster-B.png"},{"label":"Plakát C","url":"/media/48.png","thumb":"/thumbs/1081-2.jpg","source":"experiments/cards/1081-the-weather-announcer/poster-C.png"},{"label":"","url":"/media/49.png","thumb":"/thumbs/1081-3.jpg","source":"experiments/cards/1081-the-weather-announcer/poster-video.png"}],"pilot":false},{"posterSet":"Sada Five Story Posters · všechny 4 obrazy","id":"370","title":"The Wind and the Washing","cs":"Vítr a prádlo","color":"#cda56d","poem":["In the yard between the houses","the washing hangs on the line","and the wind comes along","the curious wind","and right away it puts on other people's lives","it slips into the blue shirt","and now it's a postman","carrying letters that will never arrive","it slips into the white apron","and now it's a cook","making soup out of clouds","it slips into a baby's swaddling cloth","and it giggles","it slips into a wedding dress","and dances all alone","it puffs out the sleeves","it kicks in the trouser legs","it fills the stockings with air","and everything in the yard begins to dance","dance dance","the woman on the ground floor comes out","oh the washing is flying away","and she pulls in the line","bad wind she says","wicked wind","but the wind is already gone","already trying on another life","round the corner in another street","it is the only one in the world","who puts on every life","and keeps none of them","that is why it is always hurrying on","to try just one more","and one more","because to live only one","would be too little for it"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, moderate 3/4 jazz waltz with graceful lift, bittersweet mood, balanced between warmth and sadness, warm major-minor harmony, elegant restraint, subtle emotional lift, rolling travel rhythm, distant muted trumpet, reflective piano, weary warm vocal, urban solitude, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/50.mp3"},{"label":"Live · 1920","url":"/media/51.mp3"},{"label":"Live · 1930","url":"/media/52.mp3"},{"label":"Live · 1940","url":"/media/53.mp3"}],"posters":[{"label":"Plakát A","url":"/media/54.png","thumb":"/thumbs/370-0.jpg","source":"experiments/cards/370-the-wind-and-the-washing/poster-A.png"},{"label":"","url":"/media/55.png","thumb":"/thumbs/370-1.jpg","source":"experiments/cards/370-the-wind-and-the-washing/poster-B.png"},{"label":"Plakát C","url":"/media/56.png","thumb":"/thumbs/370-2.jpg","source":"experiments/cards/370-the-wind-and-the-washing/poster-C.png"},{"label":"","url":"/media/57.png","thumb":"/thumbs/370-3.jpg","source":"experiments/cards/370-the-wind-and-the-washing/poster-video.png"}],"pilot":false},{"posterSet":"Sada Five Story Posters · všechny 4 obrazy","id":"288","title":"The Well","cs":"Studna","color":"#cda56d","poem":["In the middle of the square stands a well","and on it hangs a sign","WATER NOT DRINKABLE","and across the bucket a grate","and across the grate a lock","the council closed it","with a stamp and a by-law","the well is forbidden","the well is dangerous","the well is officially dead","but people still come","and slip their fingers through the grate","and drop a coin down","and over this water no one may drink","they whisper their wishes","let him come back","let her get well","let him say yes to me","let the children write from abroad","let this at last pass over","the coins fall into the dark","they chime on the stone and on each other","a small rain of copper and silver","wish after wish year after year","at the bottom a whole town piles up","and one day the council comes","with a stamp and a pail","to remove that improper water","and h ng","thumb":"/thumbs/372-2.jpg","source":"experiments/cards/372-the-zero/poster-C.png"},{"label":"","url":"/media/74.png","thumb":"/thumbs/372-3.jpg","source":"experiments/cards/372-the-zero/poster-video.png"}],"pilot":false},{"posterSet":"Sada Five Story Posters · všechny 4 obrazy","id":"435","title":"The Waiting Room","cs":"Čekárna","color":"#cda56d","poem":["The doctor's waiting room","smells of iodine and old paper","three coats on the coat rack","that have never met","A man with his arm in a sling","a girl coughing into her sleeve","an old lady with a shopping bag","sitting exactly one chair apart","as politeness requires","Magazines on the table","the princess is getting married","the princess divorced long ago","the horoscope says what to do in August","which August it was","nobody knows anymore","a recipe for perfect Christmas cookies","from a Christmas long since digested","Nobody speaks","and yet they understand each other","one cough answers another","one sigh another sigh","it is a shared silence","like a blanket over the knees","Next, calls the nurse","You go first, the old lady tells the man with the arm","I'm in no hurry","and then to the girl","go on, dear, you have school","I have all the time in the world","When the waiting room is empty","the doctor comes to the door","Mrs Smith, nothing wrong again?","Nothing, doctor","at home the silence is only mine","here for a while it was ours"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog sound, sophisticated great american songbook feeling, medium noir swing with a stealthy pulse, melancholic, tender, emotionally sad mood, soft minor-key harmony, restrained brushed drums, mournful saxophone replies, blue-note harmony, expressive pauses, low upright bass, mournful saxophone replies, fragile but forward-moving vocal phrasing, no humming at the beginning.","audio":[{"label":"Původní nahrávka","url":"/media/75.mp3"},{"label":"Live · 1920","url":"/media/76.mp3"},{"label":"Live · 1930","url":"/media/77.mp3"},{"label":"Live · 1940","url":"/media/78.mp3"}],"posters":[{"label":"Plakát A","url":"/media/79.png","thumb":"/thumbs/435-0.jpg","source":"experiments/cards/435-the-waiting-room/poster-A.png"},{"label":"","url":"/media/80.png","thumb":"/thumbs/435-1.jpg","source":"experiments/cards/435-the-waiting-room/poster-B.png"},{"label":"Plakát C","url":"/media/81.png","thumb":"/thumbs/435-2.jpg","source":"experiments/cards/435-the-waiting-room/poster-C.png"},{"label":"","url":"/media/82.png","thumb":"/thumbs/435-3.jpg","source":"experiments/cards/435-the-waiting-room/poster-video.png"}],"pilot":false},{"posterSet":"","id":"395","title":"One Umbrella for Two","cs":"Jeden deštník pro dva","color":"#cda56d","poem":["It's raining","and they have a single umbrella","small","round","barely enough for one","they walk pressed together","shoulder against shoulder","and each of them has","one shoulder wet","and one shoulder dry","the outside shoulder streams","the inside shoulder warms","You're not getting wet? he asks","And you you're not getting wet? she asks","and both of them lie","both have a drowned sleeve","both are smiling","Tilt it more over yourself","No over you","No over you","and on they go","tipping that little circle","this way and that","as if handing each other","a scrap of dry sky","It rains on the whole city","it rains on those who own","big umbrellas","and walk through the middle of the dry","alone","And those two","wet by half","warmed twice over","because whoever shares an umbrella","takes the rain from one side only","and with the other side","leans on someone"],"prompt":"Style prompt: inspired by the style of Jazz., Traditional Pop, elegant 1950s vocal jazz with warm female vocal, effortless phrasing, soft brass and sax sections, upright bass, brushed drums, swinging piano, rich analog <script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWord=(n,one,few,many)=>n+' '+(n===1?one:n>=2&&n<=4?few:many);
const key='ccc-review-picks-v1';let picked=new Set();try{picked=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
$('nav').innerHTML=D.collections.map(c=>`<a href="/${c.slug}.html" ${c.slug===D.collection.slug?'aria-current="page"':''}>${esc(c.title)}</a>`).join('');$('h1').textContent=D.collection.title;$('.sub').textContent=D.collection.subtitle;
$('#cards').innerHTML=D.records.map((r,i)=>`<details class="card" data-id="${r.id}" ${i===0?'open':''} style="--accent:${r.color}"><summary><span class="arrow" aria-hidden="true">›</span>${r.posters.length?`<img class="cover" src="${r.posters[0].thumb}" alt="" loading="lazy">`:`<div class="cover swatch" aria-hidden="true"><span></span></div>`}<div class="titles"><h2>${esc(r.title)}</h2><small>${esc(r.cs)} · karta ${r.id}</small></div><div class="chips">${r.pilot&&D.collection.slug==='novy-vyber'?'<span class="chip pilot">Koncertní pilot</span>':''}<span class="chip">${countWord(r.audio.length,'nahrávka','nahrávky','nahrávek')}</span><span class="chip">${r.posters.length?countWord(r.posters.length,'poster','postery','posterů'):'Poster zatím chybí'}</span></div></summary><div class="body"><div><h3>Poslech</h3>${r.audio.map(a=>`<div class="audioLabel">${esc(a.label)}</div><audio controls preload="none" src="${a.url}" aria-label="${esc(r.title+' — '+a.label)}"></audio>`).join('')||'<p>Nahrávka zatím chybí.</p>'}<button class="pick" data-pick="${r.id}" aria-pressed="${picked.has(r.id)}">${picked.has(r.id)?'Označeno ✓':'Označit pro další práci'}</button><details class="smallDetails"><summary>Text básně ▾</summary><div class="poem">${esc(r.poem.join('\n'))}</div></details><details class="smallDetails"><summary>Hudební zadání ▾</summary><div class="prompt">${esc(r.prompt||'Zadání není uložené.')}</div></details></div><div><h3>Postery</h3>${r.posterSet?`<p class="audioLabel">${esc(r.posterSet)}</p>`:""}${r.posters.length?`<div class="images">${r.posters.map(p=>`<button class="poster" data-full="${p.url}" data-title="${esc(r.title+(p.label?' · '+p.label:''))}" aria-label="Zvětšit poster ${esc(r.title)}"><img src="${p.thumb}" alt="Poster k ${esc(r.title)}${p.label?' — '+esc(p.label):''}" loading="lazy">${p.label?`<span>${esc(p.label)}</span>`:''}</button>`).join('')}</div>`:'<div class="missing">K této básni zatím není přiřazený poster.</div>'}</div></div></details>`).join('');
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filter(){const q=norm($('#search').value);let n=0;document.querySelectorAll('.card').forEach(el=>{const r=D.records.find(r=>r.id===el.dataset.id);el.hidden=!(norm(r.title+' '+r.cs+' '+r.id).includes(q)&&(!$('#only').checked||picked.has(r.id)));if(!el.hidden)n++});$('.result').textContent=`${n} z ${D.records.length} skladeb · ${D.records.filter(r=>r.posters.length).length} s postery · ${D.records.filter(r=>picked.has(r.id)).length} označeno`;$('#empty').hidden=n>0}
$('#search').addEventListener('input',filter);$('#only').addEventListener('change',filter);$('#expand').onclick=()=>document.querySelectorAll('.card:not([hidden])').forEach(d=>d.open=true);$('#collapse').onclick=()=>document.querySelectorAll('.card').forEach(d=>d.open=false);$('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
document.addEventListener('error',e=>{if(e.target.tagName==='AUDIO')$('#notice').textContent='Tuto nahrávku se nepodařilo načíst. Zkontroluj, že běží místní server.'},true);
document.addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){const id=pick.dataset.pick;picked.has(id)?picked.delete(id):picked.add(id);try{localStorage.setItem(key,JSON.stringify([...picked]))}catch{$('#notice').textContent='Prohlížeč neumožnil uložení. Výběr můžeš stáhnout tlačítkem Uložit výběr.'}pick.setAttribute('aria-pressed',picked.has(id));pick.textContent=picked.has(id)?'Označeno ✓':'Označit pro další práci';filter()}const poster=e.target.closest('[data-full]');if(poster){$('dialog img').src=poster.dataset.full;$('dialog img').alt=poster.dataset.title;$('dialog .top span').textContent=poster.dataset.title;$('dialog').showModal()}});
$('#close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close()});
$('#export').onclick=()=>{const list=D.records.filter(r=>picked.has(r.id));if(!list.length){$('#notice').textContent='Nejprve označ alespoň jednu skladbu.';return}const b=new Blob(['# '+D.collection.title+'\n\n'+list.map(r=>'- '+r.id+' — '+r.title).join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=D.collection.slug+'-vyber.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};filter();
</script></body></html>
