<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · Cello Cool Club</title>
<style>
:root{color-scheme:dark;--bg:#171411;--panel:#211c17;--ink:#eee5d7;--muted:#c0af98;--line:#514435;--gold:#d1aa73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Segoe UI',sans-serif}a{color:inherit}button,input,select,textarea{font:inherit}button,select{min-height:44px;background:#2a231c;color:var(--ink);border:1px solid #78644b;border-radius:5px;padding:8px 13px;cursor:pointer}button:hover{background:#403321}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}header{padding:24px 4vw 0;max-width:1320px;margin:auto}.brand{font-size:12px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}nav{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}nav a{padding:10px 17px;text-decoration:none;border:1px solid var(--line);border-radius:30px}nav a[aria-current]{background:var(--ink);color:var(--bg)}h1{font:normal clamp(30px,4vw,48px)/1.1 Georgia,serif;margin:20px 0 10px}.sub{color:var(--muted);margin:0 0 22px}.toolbar{position:sticky;top:0;z-index:3;background:#171411f5;border-block:1px solid var(--line);padding:12px 4vw;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{min-height:44px;width:min(300px,100%);min-width:150px;flex:1;background:#221d17;color:var(--ink);border:1px solid #78644b;padding:9px 13px;border-radius:5px}.toolbar label{color:var(--muted);display:flex;gap:8px;align-items:center}.toolbar input[type=checkbox]{width:18px;min-width:18px;min-height:18px;flex:none;accent-color:var(--gold)}main{max-width:1320px;padding:22px 4vw 80px;margin:auto}.result{font-size:14px;color:var(--muted);margin-bottom:16px}.card{border-top:1px solid var(--line)}.card:last-child{border-bottom:1px solid var(--line)}summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:40px 70px 1fr auto;gap:18px;align-items:center;padding:18px 0}summary::-webkit-details-marker{display:none}.arrow{font-size:18px;color:var(--gold)}details[open] .arrow{transform:rotate(90deg)}.cover{width:70px;height:88px;object-fit:contain;background:#29221b;border-radius:3px}.swatch{background:var(--accent);display:grid;place-items:center;border:1px solid #82715b}.swatch span{width:40px;height:40px;border:1px solid #ffffff66;border-radius:50%}.titles h2{font:normal clamp(20px,2vw,27px)/1.2 Georgia,serif;margin:0 0 5px}.titles small{color:var(--muted)}.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:20px}.pilot{color:var(--gold)}.body{padding:0 0 30px 58px;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:36px}.body h3{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:16px 0 12px}audio{width:100%;height:42px}.audioLabel{font-size:13px;color:var(--muted);margin:12px 0 5px}.poem{font:18px/1.65 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:start}.poster{border:0;background:none;padding:0;width:100%;text-align:left}.poster:hover{background:none}.poster img{width:100%;height:220px;object-fit:contain;background:#28221c;border-radius:3px}.poster span{display:block;font-size:12px;color:var(--muted);margin-top:6px}.missing{padding:30px 20px;border:1px dashed var(--line);color:var(--muted);text-align:center}.smallDetails{margin-top:20px}.smallDetails summary{display:block;padding:10px 0;color:var(--muted);font-size:14px}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--muted)}.pick{margin-top:18px}.pick[aria-pressed=true]{color:var(--bg);background:var(--gold)}dialog{width:min(96vw,1100px);height:94vh;padding:14px;background:#171411;border:1px solid var(--line);color:var(--ink)}dialog::backdrop{background:#000c}dialog img{width:100%;height:calc(100% - 60px);object-fit:contain}dialog .top{height:50px;display:flex;justify-content:space-between;align-items:center;gap:12px}dialog .top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{color:var(--muted);font-size:13px;margin-top:30px}#empty{padding:40px;text-align:center}#notice{color:var(--gold)}[hidden]{display:none!important}@media(max-width:700px){header{padding-inline:20px}.toolbar{padding-inline:20px}main{padding-inline:20px}summary{grid-template-columns:18px 50px 1fr;gap:12px}.cover{width:50px;height:68px}.chips{grid-column:3;justify-content:flex-start}.body{grid-template-columns:1fr;padding-left:0;gap:8px}.images{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar input[type=search]{flex-basis:100%;width:100%}.toolbar button{flex:1}.poster img{height:210px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><div class="brand">Cello Cool Club · poslechová police</div><nav aria-label="Výběry"></nav><h1></h1><p class="sub"></p></header>
<div class="toolbar"><input id="search" type="search" placeholder="Hledat název nebo číslo…" aria-label="Hledat skladbu"><button id="expand">Rozbalit vše</button><button id="collapse">Sbalit vše</button><button id="stop">Zastavit zvuk</button><label><input id="only" type="checkbox">Jen označené</label><button id="export">Uložit výběr</button></div>
<main><div class="result" aria-live="polite"></div><div id="notice" role="status"></div><section id="cards" aria-label="Skladby"></section><p id="empty" hidden>Žádná skladba neodpovídá filtru.</p><footer>Texty ze sbírky · základní nahrávky a dostupné Live varianty · označení se ukládá v tomto prohlížeči.</footer></main>
<dialog aria-label="Zvětšený poster"><div class="top"><span></span><button id="close">Zavřít ×</button></div><img alt=""></dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWord=(n,one,few,many)=>n+' '+(n===1?one:n>=2&&n<=4?few:many);
const key='ccc-review-picks-v1';let picked=new Set();try{picked=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
$('nav').innerHTML=D.collections.map(c=>`<a href="/${c.slug}.html" ${c.slug===D.collection.slug?'aria-current="page"':''}>${esc(c.title)}</a>`).join('');$('h1').textContent=D.collection.title;$('.sub').textContent=D.collection.subtitle;
$('#cards').innerHTML=D.records.map((r,i)=>`<details class="card" data-id="${r.id}" ${i===0?'open':''} style="--accent:${r.color}"><summary><span class="arrow" aria-hidden="true">›</span>${r.posters.length?`<img class="cover" src="${r.posters[0].thumb}" alt="" loading="lazy">`:`<div class="cover swatch" aria-hidden="true"><span></span></div>`}<div class="titles"><h2>${esc(r.title)}</h2><small>${esc(r.cs)} · karta ${r.id}</small></div><div class="chips">${r.pilot&&D.collection.slug==='novy-vyber'?'<span class="chip pilot">Koncertní pilot</span>':''}<span class="chip">${countWord(r.audio.length,'nahrávka','nahrávky','nahrávek')}</span><span class="chip">${r.posters.length?countWord(r.posters.length,'poster','postery','posterů'):'Poster zatím chybí'}</span></div></summary><div class="body"><div><h3>Poslech</h3>${r.audio.map(a=>`<div class="audioLabel">${esc(a.label)}</div><audio controls preload="none" src="${a.url}" aria-label="${esc(r.title+' — '+a.label)}"></audio>`).join('')||'<p>Nahrávka zatím chybí.</p>'}<button class="pick" data-pick="${r.id}" aria-pressed="${picked.has(r.id)}">${picked.has(r.id)?'Označeno ✓':'Označit pro další práci'}</button><details class="smallDetails"><summary>Text básně ▾</summary><div class="poem">${esc(r.poem.join('\n'))}</div></details><details class="smallDetails"><summary>Hudební zadání ▾</summary><div class="prompt">${esc(r.prompt||'Zadání není uložené.')}</div></details></div><div><h3>Postery</h3>${r.posterSet?`<p class="audioLabel">${esc(r.posterSet)}</p>`:""}${r.posters.length?`<div class="images">${r.posters.map(p=>`<button class="poster" data-full="${p.url}" data-title="${esc(r.title+(p.label?' · '+p.label:''))}" aria-label="Zvětšit poster ${esc(r.title)}"><img src="${p.thumb}" alt="Poster k ${esc(r.title)}${p.label?' — '+esc(p.label):''}" loading="lazy">${p.label?`<span>${esc(p.label)}</span>`:''}</button>`).join('')}</div>`:'<div class="missing">K této básni zatím není přiřazený poster.</div>'}</div></div></details>`).join('');
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filter(){const q=norm($('#search').value);let n=0;document.querySelectorAll('.card').forEach(el=>{const r=D.records.find(r=>r.id===el.dataset.id);el.hidden=!(norm(r.title+' '+r.cs+' '+r.id).includes(q)&&(!$('#only').checked||picked.has(r.id)));if(!el.hidden)n++});$('.result').textContent=`${n} z ${D.records.length} skladeb · ${D.records.filter(r=>r.posters.length).length} s postery · ${D.records.filter(r=>picked.has(r.id)).length} označeno`;$('#empty').hidden=n>0}
$('#search').addEventListener('input',filter);$('#only').addEventListener('change',filter);$('#expand').onclick=()=>document.querySelectorAll('.card:not([hidden])').forEach(d=>d.open=true);$('#collapse').onclick=()=>document.querySelectorAll('.card').forEach(d=>d.open=false);$('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
document.addEventListener('error',e=>{if(e.target.tagName==='AUDIO')$('#notice').textContent='Tuto nahrávku se nepodařilo načíst. Zkontroluj, že běží místní server.'},true);
document.addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){const id=pick.dataset.pick;picked.has(id)?picked.delete(id):picked.add(id);try{localStorage.setItem(key,JSON.stringify([...picked]))}catch{$('#notice').textContent='Prohlížeč neumožnil uložení. Výběr můžeš stáhnout tlačítkem Uložit výběr.'}pick.setAttribute('aria-pressed',picked.has(id));pick.textContent=picked.has(id)?'Označeno ✓':'Označit pro další práci';filter()}const poster=e.target.closest('[data-full]');if(poster){$('dialog img').src=poster.dataset.full;$('dialog img').alt=poster.dataset.title;$('dialog .top span').textContent=poster.dataset.title;$('dialog').showModal()}});
$('#close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close()});
$('#export').onclick=()=>{const list=D.records.filter(r=>picked.has(r.id));if(!list.length){$('#notice').textContent='Nejprve označ alespoň jednu skladbu.';return}const b=new Blob(['# '+D.collection.title+'\n\n'+list.map(r=>'- '+r.id+' — '+r.title).join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=D.collection.slug+'-vyber.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};filter();
</script></body></html>
