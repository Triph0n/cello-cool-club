<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mléčný zub | Cello Cool Club</title>
    <meta name="description" content="Morning card prepared: Mléčný zub.">
    <link rel="icon" href="../../assets/ccc-icon.ico">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 20px 16px 32px;
        background: radial-gradient(circle at 50% 20%, #2a160a 0%, #120904 68%);
        color: #f3e4c2;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main { display: grid; gap: 16px; justify-items: center; width: min(420px, 100%); }
      .sign { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #c5a059; }
      .stage { position: relative; width: min(320px, 82vw); aspect-ratio: 1; }
      .deck {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
      }
      .deck:focus-visible { outline: 3px solid #ffd978; outline-offset: 6px; }
      .rotor {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
          repeating-radial-gradient(circle at 50% 50%,
            #16110d 0 2.1px, #221a13 2.1px 4.2px);
        border: 1px solid rgba(197, 160, 89, 0.35);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(0, 0, 0, 0.55);
        will-change: transform;
      }
      .rotor::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 210deg,
          rgba(255, 233, 178, 0.10) 0 24deg, transparent 40deg 158deg,
          rgba(255, 233, 178, 0.07) 178deg 202deg, transparent 218deg);
        pointer-events: none;
      }
      .label {
        position: absolute;
        inset: 28.5%;
        display: block;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(197, 160, 89, 0.85);
        background: #120904;
      }
      .label img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .hole {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #120904;
        border: 1px solid rgba(243, 228, 194, 0.35);
        z-index: 3;
      }
      .tonearm {
        position: absolute;
        top: -3%;
        right: 2%;
        width: 30%;
        height: 56%;
        transform-origin: 82% 9%;
        transform: rotate(-34deg);
        transition: transform 0.9s cubic-bezier(0.33, 0.9, 0.4, 1);
        pointer-events: none;
        z-index: 4;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5));
      }
      .playing .tonearm { transform: rotate(3deg); }
      .tonearm .pivot {
        position: absolute;
        top: 2%;
        right: 8%;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #e8cf9a, #8a6a33 70%);
        border: 1px solid rgba(0, 0, 0, 0.4);
      }
      .tonearm .arm {
        position: absolute;
        top: 8%;
        right: calc(8% + 8px);
        width: 5px;
        height: 78%;
        border-radius: 3px;
        background: linear-gradient(90deg, #d9c08a, #9d7c42);
        transform: rotate(9deg);
        transform-origin: top center;
      }
      .tonearm .head {
        position: absolute;
        bottom: 4%;
        left: 34%;
        width: 12px;
        height: 26px;
        border-radius: 3px;
        background: #c5a059;
        transform: rotate(9deg);
      }
      h1 { font-size: clamp(22px, 6vw, 32px); color: #ffd978; font-weight: 600; }
      .catalog { font-size: 12px; letter-spacing: 0.2em; color: #c5a059; }
      .hint { font-size: 14px; opacity: 0.75; }
      @media (prefers-reduced-motion: reduce) {
        .tonearm { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="sign">Cello Cool Club</p>
      <div class="stage" id="stage">
        <button class="deck" type="button" id="play" aria-pressed="false" aria-label="Play Mléčný zub">
          <span class="rotor" id="rotor">
            <span class="label">
              <img src="../../assets/images/900-mlecny-zub.png" alt="Bornovská litografie: mléčný zub jako relikvie na sametovém polštářku v krabičce, matka v županu, sedm verzí odrůstajícího syna, zubní víla s deštníkem." decoding="async">
            </span>
            <span class="hole" aria-hidden="true"></span>
          </span>
        </button>
        <div class="tonearm" aria-hidden="true">
          <div class="arm"></div>
          <div class="head"></div>
          <div class="pivot"></div>
        </div>
      </div>
      <h1>Mléčný zub</h1>
      <p class="catalog">CCC-900</p>
      <audio id="audio" preload="auto" src="../../assets/audio/900-mlecny-zub.mp3"></audio>
      <p class="hint">&#9834;</p>
    </main>
    <script>
      const audio = document.getElementById("audio");
      const button = document.getElementById("play");
      const stage = document.getElementById("stage");
      const rotor = document.getElementById("rotor");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isPlaying = () => !audio.paused && !audio.ended;
      const syncState = () => {
        stage.classList.toggle("playing", isPlaying());
        button.setAttribute("aria-pressed", String(isPlaying()));
      };
      button.addEventListener("click", () => { audio.paused ? audio.play() : audio.pause(); });
      ["play", "pause", "ended"].forEach((name) => audio.addEventListener(name, syncState));

      // Vinyl physics: spin up while playing, coast to a stop on pause
      // (rAF with eased velocity) — unless the user prefers reduced motion.
      if (!reducedMotion) {
        let angle = 0;
        let velocity = 0;
        let last = performance.now();
        const CRUISE = 66; // degrees per second — a lazy 33 rpm feel
        const tick = (now) => {
          const dt = Math.min((now - last) / 1000, 0.1);
          last = now;
          const target = isPlaying() ? CRUISE : 0;
          velocity += (target - velocity) * Math.min(1, dt * 1.6);
          if (velocity > 0.05) {
            angle = (angle + velocity * dt) % 360;
            rotor.style.transform = "rotate(" + angle + "deg)";
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
      audio.play().catch(() => {});
    </script>
  </body>
</html>
